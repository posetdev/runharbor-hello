name: hello
# Runs on a RunHarbor runner: an ephemeral EC2 instance in your own AWS account,
# started for this one job and terminated when it ends.
on:
  push:
  workflow_dispatch:
jobs:
  hello:
    # rh-<arch>-<vCPU>vcpu-<GiB>gib picks the machine size.
    runs-on: [self-hosted, rh-x64-2vcpu-4gib]
    steps:
      - run: |
          echo "hello from RunHarbor"
          uname -a
          nproc
          free -h
